<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="auto" role="img" aria-label="claw-cli — Voice &amp; Text AI Terminal Assistant for Developers">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="82%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.28" />
    </pattern>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="960" height="340" rx="18" fill="url(#bgGrad)" />
  <rect width="960" height="340" rx="18" fill="url(#grid)" />
  <rect width="960" height="340" rx="18" fill="url(#glowCyan)" />
  <rect width="960" height="340" rx="18" fill="url(#glowEmerald)" />
  <rect x="1" y="1" width="958" height="338" rx="17" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.65" />

  <!-- Top Accent Line -->
  <rect x="36" y="0" width="888" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Left Logo Emblem -->
  <g transform="translate(42, 34)" filter="url(#softShadow)">
    <rect width="76" height="76" rx="18" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2" />
    <path d="M 18 27 L 29 38 L 18 49" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="36" y="31" width="4" height="14" rx="2" fill="#10B981" />
    <rect x="44" y="21" width="4" height="34" rx="2" fill="#06B6D4" />
    <rect x="52" y="27" width="4" height="22" rx="2" fill="#3B82F6" />
    <rect x="60" y="33" width="4" height="10" rx="2" fill="#10B981" />
  </g>

  <!-- Title & Badges -->
  <g transform="translate(136, 36)">
    <text x="0" y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">claw-cli</text>

    <g transform="translate(158, 11)">
      <rect x="0" y="0" width="118" height="24" rx="12" fill="#06B6D4" fill-opacity="0.14" stroke="#06B6D4" stroke-opacity="0.45" stroke-width="1" />
      <text x="59" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#38BDF8">VOICE + TEXT</text>

      <rect x="128" y="0" width="136" height="24" rx="12" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
      <text x="196" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#34D399">GEMMA 4 AI AGENT</text>

      <rect x="274" y="0" width="118" height="24" rx="12" fill="#3B82F6" fill-opacity="0.14" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1" />
      <text x="333" y="16" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#60A5FA">WINDOWS CLI</text>
    </g>

    <text x="0" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#CBD5E1">
      Voice- and text-controlled terminal &amp; desktop AI assistant for developers (Vietnamese &amp; English)
    </text>
    <text x="0" y="86" font-family="'Consolas', 'JetBrains Mono', monospace" font-size="12.5" fill="#94A3B8">
      claw ▸ "/speech on" (voice-only) · "/speech off" (text-only) · Silero VAD v5 auto end-of-utterance
    </text>
  </g>

  <!-- 4-Stage Pipeline Flow Cards -->
  <!-- Card 1: Speak into Mic -->
  <g transform="translate(42, 148)" filter="url(#softShadow)">
    <rect width="198" height="152" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="198" height="4" rx="2" fill="#06B6D4" />
    <circle cx="34" cy="36" r="16" fill="#06B6D4" fill-opacity="0.15" />
    <path d="M 34 26 C 31.8 26 30 27.8 30 30 L 30 36 C 30 38.2 31.8 40 34 40 C 36.2 40 38 38.2 38 36 L 38 30 C 38 27.8 36.2 26 34 26 Z" fill="none" stroke="#38BDF8" stroke-width="2" />
    <path d="M 27 35 C 27 38.9 30.1 42 34 42 C 37.9 42 41 38.9 41 35 M 34 42 L 34 46 M 30 46 L 38 46" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <text x="58" y="33" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.5">STEP 01</text>
    <text x="58" y="48" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Speak into Mic</text>
    <text x="18" y="76" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">16 kHz mono capture</text>
    <text x="18" y="96" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Silero VAD v5 noise filter</text>
    <rect x="18" y="112" width="162" height="24" rx="6" fill="#090D16" stroke="#1E293B" />
    <text x="99" y="128" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#38BDF8">Auto EOU after 0.6s</text>
  </g>

  <!-- Connector Arrow 1 -> 2 -->
  <g transform="translate(244, 214)">
    <line x1="0" y1="10" x2="20" y2="10" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M 16 5 L 23 10 L 16 15" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Card 2: Listen & Understand -->
  <g transform="translate(272, 148)" filter="url(#softShadow)">
    <rect width="198" height="152" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="198" height="4" rx="2" fill="#3B82F6" />
    <circle cx="34" cy="36" r="16" fill="#3B82F6" fill-opacity="0.15" />
    <circle cx="29" cy="32" r="2.5" fill="#60A5FA" />
    <circle cx="39" cy="32" r="2.5" fill="#60A5FA" />
    <circle cx="34" cy="41" r="2.5" fill="#60A5FA" />
    <path d="M 29 32 L 39 32 L 34 41 Z" fill="none" stroke="#60A5FA" stroke-width="1.6" />
    <text x="58" y="33" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#60A5FA" letter-spacing="0.5">STEP 02</text>
    <text x="58" y="48" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Listen &amp; Understand</text>
    <text x="18" y="76" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Gemma 4 E2B Vietnamese STT</text>
    <text x="18" y="96" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Gemma 4 26B reasoning</text>
    <rect x="18" y="112" width="162" height="24" rx="6" fill="#090D16" stroke="#1E293B" />
    <text x="99" y="128" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#60A5FA">Unified /v1 Gateway</text>
  </g>

  <!-- Connector Arrow 2 -> 3 -->
  <g transform="translate(474, 214)">
    <line x1="0" y1="10" x2="20" y2="10" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M 16 5 L 23 10 L 16 15" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Card 3: Autonomous Tool Use -->
  <g transform="translate(502, 148)" filter="url(#softShadow)">
    <rect width="198" height="152" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="198" height="4" rx="2" fill="#8B5CF6" />
    <circle cx="34" cy="36" r="16" fill="#8B5CF6" fill-opacity="0.15" />
    <path d="M 28 32 L 32 36 L 28 40 M 35 40 L 41 40" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="33" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#A78BFA" letter-spacing="0.5">STEP 03</text>
    <text x="58" y="48" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Execute Tools</text>
    <text x="18" y="76" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">File I/O &amp; Shell commands</text>
    <text x="18" y="96" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Windows UI Automation</text>
    <rect x="18" y="112" width="162" height="24" rx="6" fill="#090D16" stroke="#1E293B" />
    <text x="99" y="128" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#A78BFA">4-Tier Safety Sandbox</text>
  </g>

  <!-- Connector Arrow 3 -> 4 -->
  <g transform="translate(704, 214)">
    <line x1="0" y1="10" x2="20" y2="10" stroke="#34D399" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M 16 5 L 23 10 L 16 15" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Card 4: Report Results -->
  <g transform="translate(732, 148)" filter="url(#softShadow)">
    <rect width="186" height="152" rx="14" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="186" height="4" rx="2" fill="#10B981" />
    <circle cx="34" cy="36" r="16" fill="#10B981" fill-opacity="0.15" />
    <path d="M 27 34 L 31 34 L 36 29 L 36 43 L 31 38 L 27 38 Z" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 39 32 C 40.8 33.8 40.8 38.2 39 40" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" />
    <text x="58" y="33" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="0.5">STEP 04</text>
    <text x="58" y="48" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Report Results</text>
    <text x="18" y="76" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Rich terminal Markdown</text>
    <text x="18" y="96" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94A3B8">Natural neural voice TTS</text>
    <rect x="18" y="112" width="150" height="24" rx="6" fill="#090D16" stroke="#1E293B" />
    <text x="93" y="128" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#34D399">vi-VN-HoaiMyNeural</text>
  </g>
</svg>
