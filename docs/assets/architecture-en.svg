<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="auto" role="img" aria-label="claw-cli Unified Gateway Architecture">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="boxShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="250" rx="16" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Left Box: Windows PC Client -->
  <g transform="translate(28, 28)" filter="url(#boxShadow)">
    <rect width="265" height="194" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38BDF8">WINDOWS PC · CLAW-CLI</text>
    <rect x="20" y="44" width="225" height="36" rx="7" fill="#0F172A" stroke="#334155" />
    <text x="132" y="66" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" fill="#E2E8F0">Mic 16kHz + Silero VAD v5</text>

    <rect x="20" y="90" width="225" height="36" rx="7" fill="#0F172A" stroke="#334155" />
    <text x="132" y="112" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" fill="#E2E8F0">AgentLoop + Tool Sandbox</text>

    <rect x="20" y="136" width="225" height="36" rx="7" fill="#0F172A" stroke="#334155" />
    <text x="132" y="158" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" fill="#E2E8F0">Edge-TTS + Windows Control</text>
  </g>

  <!-- Center Box: Ngrok + FastAPI Unified Gateway -->
  <g transform="translate(358, 52)" filter="url(#boxShadow)">
    <rect width="235" height="146" rx="12" fill="#1E293B" fill-opacity="0.8" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.5" />
    <text x="117" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#A78BFA">UNIFIED API GATEWAY</text>
    <text x="117" y="54" text-anchor="middle" font-family="'Consolas', monospace" font-size="11.5" fill="#CBD5E1">FastAPI · Port 8000</text>
    <rect x="20" y="68" width="195" height="28" rx="6" fill="#090D16" stroke="#334155" />
    <text x="117" y="86" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#38BDF8">Single Ngrok HTTPS /v1</text>
    <text x="117" y="120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">Routes Chat &amp; Audio Requests</text>
  </g>

  <!-- Arrows Client <-> Gateway -->
  <g stroke="#38BDF8" stroke-width="2" fill="none">
    <line x1="298" y1="105" x2="352" y2="105" />
    <path d="M 346 100 L 353 105 L 346 110" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="352" y1="145" x2="298" y2="145" stroke="#10B981" />
    <path d="M 304 140 L 297 145 L 304 150" stroke="#10B981" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Boxes: Port 8001 LLM & Port 8003 STT -->
  <g transform="translate(656, 28)" filter="url(#boxShadow)">
    <rect width="276" height="86" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5" />
    <text x="18" y="28" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#60A5FA">MAIN LLM BACKEND (PORT 8001)</text>
    <text x="18" y="50" font-family="'Consolas', monospace" font-size="11.5" fill="#F8FAFC">Gemma 4 26B A4B (Q4_K_M)</text>
    <text x="18" y="70" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">POST /v1/chat/completions</text>
  </g>

  <g transform="translate(656, 136)" filter="url(#boxShadow)">
    <rect width="276" height="86" rx="12" fill="#1E293B" fill-opacity="0.75" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5" />
    <text x="18" y="28" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#34D399">STT BACKEND (PORT 8003)</text>
    <text x="18" y="50" font-family="'Consolas', monospace" font-size="11.5" fill="#F8FAFC">Gemma 4 E2B + Audio mmproj</text>
    <text x="18" y="70" font-family="'Consolas', monospace" font-size="11" fill="#94A3B8">POST /v1/audio/transcriptions</text>
  </g>

  <!-- Arrows Gateway -> Backends -->
  <g fill="none" stroke-width="2">
    <path d="M 596 102 L 626 102 L 626 72 L 650 72" stroke="#60A5FA" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 645 67 L 652 72 L 645 77" stroke="#60A5FA" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 596 148 L 626 148 L 626 178 L 650 178" stroke="#34D399" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 645 173 L 652 178 L 645 183" stroke="#34D399" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
