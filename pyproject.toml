[project]
name = "claw-cli"
version = "0.0.1"
description = "Terminal assistant controlled by voice and text in Vietnamese"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "platformdirs>=4.2",
  "numpy>=1.26",
  "sounddevice>=0.4.7",
  "faster-whisper>=1.0",
  "onnxruntime>=1.18",
  "edge-tts>=6.1",
  "structlog>=24.1",
  "httpx>=0.27.0",
  "pywin32; sys_platform == 'win32'",
  "pywinauto; sys_platform == 'win32'",
  "comtypes; sys_platform == 'win32'",
  "pycaw; sys_platform == 'win32'",
  "winrt-runtime; sys_platform == 'win32'",
  "winrt-Windows.Media.Control; sys_platform == 'win32'",
  "pyautogui>=0.9.54",
  "mss>=9.0",
  "Pillow>=10.3",
  "psutil>=5.9",
  "rapidfuzz>=3.9",
  "keyboard>=0.13.5",
  "yt-dlp",
  "playwright>=1.45",
]

[project.optional-dependencies]
wakeword = ["openwakeword>=0.6"]
piper = ["piper-tts>=1.2"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[project.scripts]
claw = "claw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
